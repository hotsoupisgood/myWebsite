<text x="862.5" y="483" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#91466b">Ask an LLM</text>
<polyline points="930,450 930,365 700,365" fill="none" stroke="#91466b" stroke-width="3" stroke-linejoin="round"/>
<polygon points="700,365 709.6534081807941,359.7263190753538 709.6534081807941,370.2736809246462" fill="#91466b"/>
<text x="770" y="332" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#91466b">Return to the source</text>
