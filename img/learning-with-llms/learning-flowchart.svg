<text x="331.5" y="822" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172b3a">synthesize?</text>
<polyline points="160,820 50,820 50,365 100,365" fill="none" stroke="#245a81" stroke-width="3" stroke-linejoin="round"/>
<polygon points="100,365 90.3465918192059,370.2736809246462 90.3465918192059,359.7263190753538" fill="#245a81"/>
<text x="65" y="787" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#245a81">NOT YET</text>
