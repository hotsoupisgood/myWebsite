<text x="224.0" y="229.0" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172b3a">Ask an LLM for the best reviews</text>
<text x="249.5" y="255.0" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172b3a">or textbooks on the subject</text>
<polyline points="400,290 400,330" fill="none" stroke="#245a81" stroke-width="3" stroke-linejoin="round"/>
<polygon points="400,330 394.7263190753538,320.3465918192059 405.2736809246462,320.3465918192059" fill="#245a81"/>
<rect x="100" y="330" width="600" height="70" rx="0" fill="#ffffff" stroke="#9bacbd" stroke-width="2"/>
<text x="233.015625" y="339.0" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172b3a">Follow the source. Take notes.</text>
<text x="262.015625" y="365.0" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172b3a">Test your understanding.</text>
<polyline points="400,400 400,440" fill="none" stroke="#245a81" stroke-width="3" stroke-linejoin="round"/>
<polygon points="400,440 394.7263190753538,430.3465918192059 405.2736809246462,430.3465918192059" fill="#245a81"/>
<polygon points="400.0,440 620,495.0 400.0,550 180,495.0" fill="#eaf1f8" stroke="#9bacbd" stroke-width="2"/>
<text x="305.5" y="482" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172b3a">Hit a roadblock?</text>
<polyline points="620,495 780,495" fill="none" stroke="#91466b" stroke-width="3" stroke-linejoin="round"/>
<polygon points="780,495 770.3465918192059,500.2736809246462 770.3465918192059,489.7263190753538" fill="#91466b"/>
<text x="676" y="466" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#91466b">YES</text>
