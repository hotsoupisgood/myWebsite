<title id="title">How I start a technical project</title><desc id="desc">Start with Wikipedia and questions. Ask an LLM for the best reviews or textbooks on the subject. Read and work on paper. Use LLM explanations at roadblocks, return to sources or choose another source, collect notes, and create a final learning artifact.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="320" y="20" width="160" height="55" rx="28" fill="#eaf1f8" stroke="#9bacbd" stroke-width="2"/>
<text x="373.5" y="37" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172b3a">Start</text>
<polyline points="400,75 400,110" fill="none" stroke="#245a81" stroke-width="3" stroke-linejoin="round"/>
<polygon points="400,110 394.7263190753538,100.3465918192059 405.2736809246462,100.3465918192059" fill="#245a81"/>
<rect x="100" y="110" width="600" height="70" rx="0" fill="#ffffff" stroke="#9bacbd" stroke-width="2"/>
<text x="209.0" y="132.0" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172b3a">Explore Wikipedia. Note questions.</text>
<polyline points="400,180 400,220" fill="none" stroke="#245a81" stroke-width="3" stroke-linejoin="round"/>
<polygon points="400,220 394.7263190753538,210.3465918192059 405.2736809246462,210.3465918192059" fill="#245a81"/>
