<text x="416" y="590" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#245a81">NO / RESOLVED</text>
<rect x="100" y="650" width="600" height="70" rx="0" fill="#ffffff" stroke="#9bacbd" stroke-width="2"/>
<text x="206.0" y="672.0" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172b3a">Gather notes and worked examples</text>
<polyline points="400,720 400,760" fill="none" stroke="#245a81" stroke-width="3" stroke-linejoin="round"/>
<polygon points="400,760 394.7263190753538,750.3465918192059 405.2736809246462,750.3465918192059" fill="#245a81"/>
<polygon points="400.0,760 640,820.0 400.0,880 160,820.0" fill="#eaf1f8" stroke="#9bacbd" stroke-width="2"/>
